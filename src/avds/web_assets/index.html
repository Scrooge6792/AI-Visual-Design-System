<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视觉资料台</title><link rel="stylesheet" href="/app.css"></head><body>
<div class="app-shell"><aside class="spectrum" aria-label="十二分面导航"><div class="mark">VD</div><nav id="facetRail"></nav><button class="rail-button" id="refreshButton" title="刷新">↻</button></aside><main>
<header class="masthead"><div><p class="eyebrow">LOCAL VISUAL ARCHIVE</p><h1>视觉资料台</h1><p class="lede">从已经确认的内容里，找到下一张真正有用的图。</p></div><div class="system-state"><span id="coreLamp"></span><div><b id="coreState">连接中</b><small>受信 Core</small></div></div></header>
<section class="search-stage"><label for="searchInput">搜索已批准素材</label><div class="search-line"><input id="searchInput" placeholder="例如：逆光、雪景、构图参考"><button id="searchButton">在资料台上找</button></div><div class="filter-row"><select id="orientation"><option value="">全部方向</option><option value="landscape">横向</option><option value="portrait">纵向</option><option value="square">方形</option></select><select id="format"><option value="">全部格式</option><option value="png">PNG</option><option value="jpeg">JPEG</option><option value="heic">HEIC</option><option value="webp">WebP</option></select><span id="resultCount">等待查询</span></div></section>
<section class="workspace"><div class="light-table"><div class="section-head"><div><span>ACTIVE ASSETS</span><h2>素材灯箱</h2></div><button class="text-button" id="pendingButton">查看待审队列 <b id="pendingCount">0</b></button></div><div id="assetGrid" class="asset-grid"></div></div><aside class="inspector" id="inspector"><p class="eyebrow">INSPECTOR</p><h2>选择一张素材</h2><p>这里显示正式修订、尺寸、概念与原图入口。草案不会混入。</p></aside></section>
<section class="library-shelf"><article><p class="eyebrow">KNOWLEDGE</p><h2>知识卡片</h2><div id="knowledgeList" class="mini-list"></div></article><article><p class="eyebrow">PROMPT MODULES</p><h2>结构化 Prompt</h2><div id="promptList" class="mini-list"></div></article></section>
</main></div><dialog id="pendingDialog"><form method="dialog"><div class="dialog-head"><div><span>PENDING</span><h2>待审队列</h2></div><button aria-label="关闭">×</button></div><div id="pendingGrid" class="pending-grid"></div></form></dialog><script src="/app.js"></script></body></html>
