[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avds-local"
version = "1.0.0"
description = "Local visual asset archive with Agent and browser workflows"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
avds = "avds.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
avds = ["schema.sql", "schemas/*.json", "web_assets/*"]
